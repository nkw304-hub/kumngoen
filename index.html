/* Layout idea: one dark navy "wallet" column; gold marks money, wine marks actions. */
:root{
  --font-body:'IBM Plex Sans Thai',-apple-system,'Sukhumvit Set',Thonburi,'Leelawadee UI',system-ui,sans-serif;
  --font-serif:'Playfair Display','IBM Plex Sans Thai',Georgia,serif;
  --num-font:var(--font-serif);
  --bg:#0F2340;--bg-rgb:15 35 64;
  --surface:#152C4E;--surface-2:#1B355C;--sheet:#132A4A;--bar:rgb(11 27 50 / .94);--input:rgb(255 255 255 / .04);
  --line:#213A60;--line-2:#2E4A73;--track:#24406A;
  --text:#EDE6D6;--soft:#C3CCDA;--muted:#8E9BB3;
  --accent:#C9A45C;--on-accent:#0F2340;
  --wine:#8E1B2C;--wine-soft:#C25062;--on-wine:#F6EFE2;
  --in:#7FA7D1;--out:#D8C9A8;
  --pc-gold:#C9A45C;--pc-steel:#7FA7D1;--pc-sand:#D8C9A8;--pc-ivory:#EDE6D6;--pc-wine:#C25062;--pc-copper:#C8844A;
  --overlay:.55;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4EFE4;--bg-rgb:244 239 228;
  --surface:#FFFDF8;--surface-2:#F1EADC;--sheet:#FFFDF8;--bar:rgb(255 252 246 / .95);--input:#FFFFFF;
  --line:#E6DDCC;--line-2:#D3C7B0;--track:#E9E0CF;
  --text:#13233D;--soft:#3E4C63;--muted:#6E7A8E;
  --accent:#9A742A;--on-accent:#FFF9EF;
  --wine:#8E1B2C;--wine-soft:#A3283B;--on-wine:#FFF8EE;
  --in:#2F639A;--out:#7A6A4C;
  --pc-gold:#A88232;--pc-steel:#3F73A8;--pc-sand:#8F7A55;--pc-ivory:#13233D;--pc-wine:#A3283B;--pc-copper:#A0612B;
  color-scheme:light;
}
:root[data-accent="wine"]{--accent:#D27585;--on-accent:#1C0A0F}
:root[data-accent="steel"]{--accent:#93B8DE;--on-accent:#0F2340}
:root[data-accent="copper"]{--accent:#D0915A;--on-accent:#1E1206}
:root[data-theme="light"][data-accent="wine"]{--accent:#8E1B2C;--on-accent:#FFF8EE}
:root[data-theme="light"][data-accent="steel"]{--accent:#2F639A;--on-accent:#FFF8EE}
:root[data-theme="light"][data-accent="copper"]{--accent:#9A5A25;--on-accent:#FFF8EE}
:root[data-img="1"]{--surface:rgb(15 35 64 / .80);--surface-2:rgb(30 56 96 / .78);--sheet:rgb(16 37 66 / .97)}
:root[data-num="sans"]{--num-font:var(--font-body)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,.datechip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
#bg{position:fixed;inset:0;z-index:0;background:var(--bg) center/cover no-repeat}
:root[data-img="1"] #bg::after{content:"";position:absolute;inset:0;background:rgb(var(--bg-rgb) / var(--overlay))}
#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) 16px 28px}

.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex-shrink:0}
.ic.tiny{width:.85em;height:.85em;margin-left:5px;color:var(--muted);vertical-align:-.08em}
.num,.ain,.big-in,.key,.qa-amt{font-family:var(--num-font);font-variant-numeric:lining-nums tabular-nums}
svg text{font-variant-numeric:lining-nums tabular-nums}
.muted{color:var(--muted)}.soft{color:var(--soft)}.sm{font-size:13px}small{font-size:12px}
.acc{color:var(--accent)}.in{color:var(--in)}.out{color:var(--out)}.wd{color:var(--wine-soft)}.ok{color:var(--accent)}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:4px 8px calc(env(safe-area-inset-bottom) + 4px);background:var(--bar);border-top:.5px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--muted);min-height:50px}
.tab .ic{width:22px;height:22px}
.tab.on{color:var(--accent)}
.fab{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--wine);color:var(--on-wine);border:1px solid var(--accent);display:grid;place-items:center;margin-top:-24px;box-shadow:0 8px 20px rgb(0 0 0 / .3)}
.fab .ic{width:26px;height:26px;stroke-width:1.8}

/* headers */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.title{font-size:20px;font-weight:500;line-height:1.3}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);border:.5px solid var(--line-2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.streak.on{color:var(--accent);border-color:var(--accent)}
.subhead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:-6px -6px 10px}
.subhead h1{font-size:17px;font-weight:500;text-align:center;margin:0}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--soft);flex-shrink:0}
.iconbtn .ic{width:22px;height:22px}
.iconbtn[disabled]{opacity:.3;cursor:default}

/* hero */
.hero{padding:2px 0 8px}
.big{font-size:46px;line-height:1.15;color:var(--accent);margin:2px 0 2px}
.big.neg{color:var(--wine-soft)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--surface);border:.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-weight:500;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* cards, lists */
.card{background:var(--surface);border:.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.card.cta{border-color:var(--accent)}
.card.cta h3{margin:0 0 4px;font-size:16px;font-weight:500}
.card.cta p{margin:0 0 12px;color:var(--soft);font-size:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.sec{font-size:13px;color:var(--muted);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec button{color:var(--accent);font-size:13px}
.pot{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);border:.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.pot-ic{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0}
.pot-ic .ic{width:20px;height:20px}
.pot-ic.lg{width:46px;height:46px;border-radius:14px}
.pot-ic.lg .ic{width:24px;height:24px}
.pot-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pot-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pot-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pot-row .num{white-space:nowrap}
.bar{display:block;height:4px;border-radius:2px;background:var(--track);position:relative}
.bar>i{display:block;height:100%;border-radius:2px;max-width:100%}
.bar .mark{position:absolute;top:-4px;width:2px;height:12px;background:var(--text);border-radius:1px;margin-left:-1px}
.bar.thick{height:6px;border-radius:3px}
.strip{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin:8px 0 2px;background:var(--track)}
.strip i{display:block;height:100%}
.list{background:var(--surface);border:.5px solid var(--line);border-radius:16px;padding:0 12px;margin-bottom:10px}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border-bottom:.5px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx-ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);flex-shrink:0}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-main span,.tx-main small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-main small{color:var(--muted)}
.tx-amt{white-space:nowrap}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:.5px solid var(--line)}
.prow:first-of-type{border-top:0}
.pi{color:var(--accent);display:grid;place-items:center}
.pn{flex:1;min-width:0;display:flex;flex-direction:column}
.pn small{color:var(--muted)}
.linkrow{display:flex;align-items:center;gap:8px;width:100%;color:var(--accent);font-size:13px;padding:8px 2px 12px}
.linkrow .ic:last-child{margin-left:auto}
.empty{text-align:center;padding:22px 12px;color:var(--muted);font-size:14px}
.empty .ic{width:28px;height:28px;display:block;margin:0 auto 6px;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.kv span:first-child{color:var(--soft)}
.note{font-size:13px;color:var(--muted);margin:8px 2px}
.banner{background:var(--wine);color:var(--on-wine);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:.5px solid var(--line-2);font-weight:500;text-align:center}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.primary{background:var(--wine);color:var(--on-wine);border:1px solid var(--accent)}
.btn.gold{background:var(--accent);color:var(--on-accent);border:0}
.btn.block{width:100%}
.btn.danger{color:var(--wine-soft);border-color:var(--wine-soft)}
.btn.ghost{border:0;color:var(--muted)}
.btn:active,.pot:active,.tx:active,.chip:active,.key:active{transform:scale(.98)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:.5px solid var(--line-2);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;min-height:42px;border-radius:10px;border:.5px solid var(--line-2);font-size:13px;padding:6px 8px;text-align:center;line-height:1.3}
.seg button.on{border:1.5px solid var(--accent);color:var(--accent)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 0;text-align:left}
.toggle-row small{display:block;color:var(--muted)}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--line-2);position:relative;flex-shrink:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text);transition:transform .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(18px);background:var(--bg)}

/* menu */
.menu{background:var(--surface);border:.5px solid var(--line);border-radius:16px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-bottom:.5px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .pot-ic{color:var(--accent)}
.mrow > span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.mrow small{color:var(--muted)}
.mrow > .ic{color:var(--muted)}

/* sheets */
.backdrop{position:fixed;inset:0;z-index:50;background:rgb(4 10 20 / .55);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.backdrop.open{opacity:1}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--sheet);border-radius:22px 22px 0 0;border-top:.5px solid var(--line-2);padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(28px);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.backdrop.open .sheet{transform:none}
.sheet.full{height:100%;max-height:none;border-radius:0;border:0;padding-top:calc(env(safe-area-inset-top) + 8px);display:flex;flex-direction:column}
@media (min-width:620px){.backdrop{align-items:center}.sheet{border-radius:22px;border:.5px solid var(--line-2);max-height:88%}.sheet.full{height:auto;max-height:94%;border-radius:22px;border:.5px solid var(--line-2);padding-top:12px}}
@media (prefers-reduced-motion:reduce){.backdrop,.sheet,.toggle,.toggle::after,#toast{transition:none}}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sheet-h>div{flex:1;min-width:0}
.sheet-h h2{margin:0;font-size:17px;font-weight:500;line-height:1.35}
.sheet-h small{color:var(--muted)}
.sheet .big{font-size:38px}
.fl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.field{width:100%;min-height:46px;border-radius:12px;border:.5px solid var(--line-2);background:var(--input);color:var(--text);padding:0 12px;font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.field:focus{outline:none;border-color:var(--accent)}
.field::placeholder{color:var(--muted)}
.hint{display:block;color:var(--muted);margin-top:4px}
.err{color:var(--wine-soft);font-size:13px;margin-top:8px}
.err:empty{display:none}
.icongrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.icopt{aspect-ratio:1;border-radius:10px;border:.5px solid var(--line-2);display:grid;place-items:center;color:var(--soft)}
.icopt .ic{width:20px;height:20px}
.icopt.on{border:1.5px solid var(--accent);color:var(--accent)}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%}
.swatch.on{outline:2px solid var(--text);outline-offset:3px}
.row-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:16px}

/* quick add */
.qa{display:flex;flex-direction:column;flex:1;min-height:0}
.qa-top{display:flex;justify-content:space-between;align-items:center}
.datechip{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--soft);border:.5px solid var(--line-2);border-radius:999px;padding:6px 12px;min-height:36px}
.datechip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;cursor:pointer}
.qa-amt{text-align:center;font-size:50px;color:var(--accent);margin:6px 0 0;line-height:1.2;white-space:nowrap;overflow:hidden}
.qa-amt.ph{color:var(--muted)}
.qa-after{text-align:center;min-height:20px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.subgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0 8px}
.subopt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:.5px solid var(--line-2);border-radius:12px;padding:7px 3px;font-size:11px;text-align:center;line-height:1.25;min-height:58px;color:var(--soft)}
.subopt .ic{width:20px;height:20px}
.subopt span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
.subopt.on{border:1.5px solid var(--accent);color:var(--accent)}
.subopt.add{border-style:dashed;color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:auto;padding-top:8px}
.key{min-height:52px;border-radius:14px;background:var(--surface-2);font-size:24px;display:grid;place-items:center;font-family:var(--num-font)}
.key.fn{font-size:14px;color:var(--soft);font-family:var(--font-body)}
.key.fn.on{color:var(--accent)}
.qa .save{margin-top:8px;min-height:52px;font-size:16px}
.qa .err{text-align:center}

/* allocation */
.big-in{min-height:58px;font-size:28px;font-family:var(--num-font);font-variant-numeric:lining-nums tabular-nums;color:var(--accent)}
.arow{background:var(--surface);border:.5px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.arow-h{display:flex;align-items:center;gap:10px}
.aname{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:500}
.aname small{font-weight:400;color:var(--muted)}
.ain{width:118px;text-align:right;font-family:var(--num-font);font-variant-numeric:lining-nums tabular-nums}
.ain.sm{width:100px;min-height:38px;font-size:15px}
.asubs{margin:8px 0 0 48px;display:flex;flex-direction:column;gap:6px}
.asub{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--soft)}
.asub span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.afoot{position:sticky;bottom:-28px;margin:14px -16px -28px;padding:12px 16px 20px;background:var(--bar);border-top:.5px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.afoot .kv{padding:2px 0}
.rem-ok{color:var(--accent)}.rem-over{color:var(--wine-soft)}

/* charts */
.donut-wrap{display:flex;align-items:center;gap:16px}
.legend{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.legend div{display:flex;justify-content:space-between;gap:8px}
.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.bars{position:relative;height:120px;display:flex;align-items:flex-end;gap:10px;padding:0 4px;border-bottom:.5px solid var(--line-2)}
.bars .b{flex:1;background:var(--line-2);border-radius:5px 5px 0 0;min-height:2px}
.bars .b.on{background:var(--accent)}
.incline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--in)}
.blabels{display:flex;gap:10px;padding:4px 4px 0;font-size:11px;color:var(--muted)}
.blabels button{flex:1;text-align:center;min-height:28px}
.blabels .on{color:var(--accent)}

/* customize */
.bgopts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.bgopt{aspect-ratio:3/4.4;border-radius:12px;border:.5px solid var(--line-2);background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 2px;font-size:11px;position:relative;overflow:hidden;color:var(--soft)}
.bgopt.on{border:2px solid var(--accent)}
.bgopt span{background:rgb(8 18 34 / .55);color:#F3EDE1;border-radius:6px;padding:1px 6px;white-space:nowrap}
.bgopt .ic{width:22px;height:22px;margin-bottom:auto;margin-top:auto}
input[type=range]{width:100%;accent-color:var(--accent);min-height:36px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,16px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .22s,transform .22s;z-index:90;pointer-events:none;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="app">
  <main id="screen" aria-live="polite"></main>
  <nav class="tabbar" aria-label="เมนูหลัก">
    <button class="tab" data-a="go" data-v="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l-2 0l9 -9l9 9l-2 0" /> <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /> <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /></svg>หน้าแรก</button>
    <button class="tab" data-a="go" data-v="summary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3.2a9 9 0 1 0 10.8 10.8a1 1 0 0 0 -1 -1h-6.8a2 2 0 0 1 -2 -2v-7a.9 .9 0 0 0 -1 -.8" /> <path d="M15 3.5a9 9 0 0 1 5.5 5.5h-4.5a1 1 0 0 1 -1 -1v-4.5" /></svg>สรุป</button>
    <button class="fab" data-a="add" aria-label="จดรายจ่าย"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l0 14" /> <path d="M5 12l14 0" /></svg></button>
    <button class="tab" data-a="go" data-v="goals"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /> <path d="M12 12m-5 0a5 5 0 1 0 10 0a5 5 0 1 0 -10 0" /> <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /></svg>เป้าหมาย</button>
    <button class="tab" data-a="go" data-v="menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l16 0" /> <path d="M4 12l16 0" /> <path d="M4 18l16 0" /></svg>เมนู</button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>

  const idx = Math.max(0, Math.floor(ymDiff(S.startYm, ym) / 12));
  const start = ymAdd(S.startYm, idx * 12);
  return { idx, start, end: ymAdd(start, 11), elapsed: Math.min(12, ymDiff(start, ym) + 1) };
}
function goalsFor(idx) {
  if (!S.goals[idx]) {
    const prev = S.goals[idx - 1];
    S.goals[idx] = prev ? { save: prev.save, invest: prev.invest, debts: prev.debts.filter(id => { const d = debt(id); return d && dstate(d).bal > 0; }) } : { save: 0, invest: 0, debts: [] };
  }
  return S.goals[idx];
}
function netInflow(role, from, to) {
  const ids = new Set(S.pots.filter(p => p.role === role).map(p => p.id));
  let b = 0;
  for (const [ym, m] of Object.entries(S.months)) { if (!m.allocated || ym < from || ym > to) continue; for (const id of ids) b += m.alloc[id] || 0; }
  for (const t of S.tx) {
    const y = t.date.slice(0, 7); if (y < from || y > to) continue;
    if (t.type === 'sweep' && ids.has(t.toPotId)) b += t.amount;
    else if (OUT.has(t.type) && ids.has(t.potId)) b -= t.amount;
    else if (t.type === 'debtpay' && ids.has(t.selfPot)) b += t.amount;
  }
  return b;
}

    }
  }

};

/* allocation */
function makeDraft(ym) {
  const m = mon(ym), editing = m && m.allocated;
  const lastYm = Object.keys(S.months).filter(k => S.months[k].allocated && k < ym).sort().pop();
  const L = editing ? m : (lastYm ? S.months[lastYm] : null);
  const D = { ym, income: L ? L.income : (S.lastIncome || 0), alloc: {}, subAlloc: {} };
  for (const p of pots()) if (p.mode !== 'debt') D.alloc[p.id] = L && L.alloc[p.id] !== undefined ? L.alloc[p.id] : (p.amount || 0);
  for (const s of S.subs) D.subAlloc[s.id] = L && (L.subAlloc || {})[s.id] !== undefined ? L.subAlloc[s.id] : (s.monthly || 0);
  if (L && L.autoRem) { const sp = savePot(); if (sp) D.alloc[sp.id] = Math.max(0, (D.alloc[sp.id] || 0) - L.autoRem); }
  return D;
}
function startAlloc(ym) { UI.draft = makeDraft(ym); go('alloc'); }
function allocCalc() {
  const D = UI.draft, dd = debtDue(D.ym);
  const total = sum(Object.entries(D.alloc).filter(([id]) => pot(id) && !pot(id).hidden).map(([, v]) => v)) + dd;
  return { dd, total, rem: (D.income || 0) - total };
}
VIEWS.alloc = () => {
  if (!UI.draft) UI.draft = makeDraft(curYm());

  for (const p of pots()) {
    if (p.mode === 'debt') {

      continue;
    }
    const subs = subsOf(p.id);
    h += `<div class="arow"><div class="arow-h"><span class="pot-ic" style="color:var(--pc-${p.color})">${ic(p.icon)}</span><span class="aname">${esc(p.name)}<small>${p.mode === 'acc' ? 'สะสมต่อเนื่อง' : 'รายเดือน'}</small></span><input class="field ain" inputmode="numeric" autocomplete="off" data-f="pot" data-id="${p.id}" value="${D.alloc[p.id] || ''}" placeholder="0" aria-label="ยอด${esc(p.name)}"></div>${subs.length ? `<div class="asubs">${subs.map(s => `<div class="asub"><span>${ic(s.icon)} ${esc(s.name)}</span><input class="field ain sm" inputmode="numeric" autocomplete="off" data-f="sub" data-id="${s.id}" value="${D.subAlloc[s.id] || ''}" placeholder="0" aria-label="ยอด${esc(s.name)}"></div>`).join('')}<div class="err" data-suberr="${p.id}"></div></div>` : ''}</div>`;
  }
  h += `<p class="note">ยอดของรายการย่อยไม่บังคับ ใส่เพื่อแยกงบหรือสะสมเป้า เช่น เที่ยวญี่ปุ่นเดือนละ 2,000</p>`;
  h += `<div class="afoot"><div class="kv"><span>รวมที่แบ่ง</span><b class="num" id="a-total"></b></div><div class="kv" id="a-rem"></div><div class="err" id="a-err"></div><button class="btn primary block" style="margin-top:8px" data-a="allocSave">${editing ? 'บันทึกยอดใหม่' : 'ยืนยันการแบ่งเงิน'}</button></div>`;
  return h;
};
AFTER.alloc = () => updateAllocFooter();
function updateAllocFooter() {
  if (!UI.draft || !$('#a-total')) return;
  const D = UI.draft, c = allocCalc(), sp = savePot();
  $('#a-total').textContent = baht(c.total);
  const r = $('#a-rem');
  r.innerHTML = c.rem === 0 ? `<span class="rem-ok">${ic('circle-check')} แบ่งครบพอดี</span><span></span>`
    : c.rem > 0 ? `<span>ยังไม่ได้แบ่ง<br><small class="muted">ยืนยันแล้วจะเข้า${esc(sp ? sp.name : 'เงินเก็บ')}</small></span><b class="num">${baht(c.rem)}</b>`
    : `<span class="rem-over">แบ่งเกินรายรับ</span><b class="num rem-over">${baht(-c.rem)}</b>`;
  for (const p of pots()) {
    const e = document.querySelector(`[data-suberr="${p.id}"]`); if (!e) continue;
    const s = sum(subsOf(p.id).map(x => D.subAlloc[x.id] || 0));
    e.textContent = s > (D.alloc[p.id] || 0) ? `รายการย่อยรวม ${fmt(s)} เกินยอดกระเป๋า ${fmt(D.alloc[p.id] || 0)}` : '';
  }
}
function saveAlloc() {
  const D = UI.draft, c = allocCalc(), err = $('#a-err');
  if (!(D.income > 0)) { err.textContent = 'ใส่รายรับเดือนนี้ก่อน'; return; }
  if (c.rem < 0) { err.textContent = `แบ่งเกินรายรับ ${fmt(-c.rem)} บาท ลดยอดบางกระเป๋าก่อน`; return; }
  for (const p of pots()) { const s = sum(subsOf(p.id).map(x => D.subAlloc[x.id] || 0)); if (s > (D.alloc[p.id] || 0)) { err.textContent = `รายการย่อยของ${p.name}รวมเกินยอดกระเป๋า`; return; } }
  const alloc = { ...D.alloc }, dp = debtPot(); if (dp) alloc[dp.id] = c.dd;
  const sp = savePot(); if (c.rem > 0 && sp) alloc[sp.id] = (alloc[sp.id] || 0) + c.rem;
  const hadAny = Object.values(S.months).some(m => m.allocated);
  S.months[D.ym] = { ...(S.months[D.ym] || {}), income: D.income, alloc, subAlloc: { ...D.subAlloc }, allocated: true, allocatedAt: Date.now(), autoRem: c.rem > 0 && sp ? c.rem : 0 };
  for (const p of pots()) if (p.mode !== 'debt') p.amount = D.alloc[p.id] || 0;
  for (const s of S.subs) if (D.subAlloc[s.id] !== undefined) s.monthly = D.subAlloc[s.id];
  S.lastIncome = D.income; if (!hadAny) S.startYm = D.ym;
  const ym = D.ym; save(); UI.draft = null; go('home');
  toast(c.rem > 0 ? `แบ่งเงินแล้ว ส่วนที่เหลือ ${fmt(c.rem)} เข้า${sp.name}` : `แบ่งเงินเดือน${monthLabel(ym, 'mon')}แล้ว`);
}

      h += `<div style="margin:6px 0 0 50px">${subsOf(p.id).map(s => `<button class="tx" data-a="subEdit" data-id="${s.id}"><span class="tx-ic" style="width:28px;height:28px">${ic(s.icon)}</span><span class="tx-main"><span>${esc(s.name)}</span>${s.monthly || s.target ? `<small>${[s.monthly ? `เดือนละ ${fmt(s.monthly)}` : '', s.target && p.mode === 'acc' ? `เป้า ${fmt(s.target)}` : ''].filter(Boolean).join(' · ')}</small>` : ''}</span>${ic('chevron-right')}</button>`).join('')}<button class="linkrow" data-a="subNew" data-pot="${p.id}">${ic('plus')} เพิ่มรายการย่อย</button></div>`;

};

VIEWS.debts = () => {
  let h = subHead('หนี้สิน');

  if (!all.length) h += `<div class="empty">${ic('credit-card')}ยังไม่มีหนี้ เพิ่มหนี้ที่ผ่อนอยู่ แอปจะนับงวดและรวมยอดในกระเป๋าหนี้สินให้</div>`;
  const card = ({ d, s }) => `<button class="pot" data-a="debtEdit" data-id="${d.id}"><span class="pot-ic" style="color:var(--pc-wine)">${ic(d.icon)}</span><span class="pot-main"><span class="pot-row"><span class="pot-name">${esc(d.name)}</span><span class="num">${s.bal ? `เหลือ ${fmt(s.bal)}` : 'ปิดแล้ว'}</span></span>${bar(s.total ? s.done / s.total * 100 : 100, 'var(--wine-soft)')}<small class="muted">งวด ${s.done}/${s.total}${s.bal ? ` · งวดละ ${fmt(d.installment)} · ทุกวันที่ ${d.day}${s.payoff ? ` · ปิดได้ ${monthLabel(s.payoff, 'shortY')}` : ''}` : ''}${d.selfPot ? ' · คืนเงินตัวเอง' : ''}${d.startYm > curYm() ? ` · เริ่ม ${monthLabel(d.startYm, 'shortY')}` : ''}</small></span></button>`;

/* ---------- render & nav ---------- */
let view = 'home';
const TABOF = { home: 'home', review: 'home', alloc: 'home', summary: 'summary', goals: 'goals', menu: 'menu', cats: 'menu', debts: 'menu', recurring: 'menu', custom: 'menu', backup: 'menu' };
function render() {
  applyTheme();
  const v = VIEWS[view] ? view : 'home';
  const html = VIEWS[v]();
  if (v !== view) return; // a view redirected itself
  $('#screen').innerHTML = html;
  AFTER[v] && AFTER[v]();
  document.querySelectorAll('.tab').forEach(t => { const on = t.dataset.v === TABOF[v]; t.classList.toggle('on', on); on ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'); });
}
function go(v) { view = v; render(); $('#screen').scrollTop = 0; }

/* ---------- sheets: quick add ---------- */
let QA_KEYS = null;
function openQuickAdd(init = {}) {
  const choices = spendPots();
  if (!choices.length) { toast('ยังไม่มีกระเป๋าที่จดรายจ่ายได้'); return; }
  const q = Object.assign({ amount: '', potId: null, subId: null, date: today(), note: '', editId: null, noteOpen: false }, init);
  if (!q.potId || !choices.find(p => p.id === q.potId)) q.potId = (choices.find(p => p.id === S.lastPot) || choices.find(p => p.role === 'daily') || choices[0]).id;
  const orig = q.editId ? S.tx.find(t => t.id === q.editId) : null;
  const sh = sheet('<div class="qa"></div>', onS, { full: true, label: 'จดรายจ่าย', onClose: () => { QA_KEYS = null; } });
  const box = sh.querySelector('.qa');
  function after() {
    const p = pot(q.potId), amt = +q.amount || 0, ym = q.date.slice(0, 7);
    const back = orig && orig.potId === p.id && (p.mode === 'acc' || inYm(orig, ym)) ? orig.amount : 0;
    let left;
    if (p.mode === 'acc') left = accBalance(p.id) + back - amt;
    else { if (!allocated(ym)) return `ยังไม่ได้แบ่งเงินเดือน${monthLabel(ym, 'mon')}`; left = potAlloc(p.id, ym) - potSpent(p.id, ym) + back - amt; }
    let t = `${esc(p.name)}เหลือ ${fmt(left)} หลังบันทึก`;
    const s = sub(q.subId);
    if (s && p.mode === 'month' && subAllocOf(s.id, ym)) { const sb = orig && orig.subId === s.id && inYm(orig, ym) ? orig.amount : 0; t += ` · ${esc(s.name.split(' /')[0])}เหลือ ${fmt(subAllocOf(s.id, ym) - subSpent(s.id, ym) + sb - amt)}`; }
    return t;
  }
  function draw() {
    const subs = subsOf(q.potId);
    box.innerHTML = `<div class="qa-top">${closeBtn}<label class="datechip">${ic('calendar')} <span>${dayLabel(q.date)}</span><input type="date" id="qa-date" value="${q.date}" max="${today()}" aria-label="วันที่"></label></div>
    <div class="qa-amt num ${q.amount ? '' : 'ph'}" aria-live="polite">฿${q.amount ? fmt(+q.amount) : '0'}</div>
    <div class="qa-after">${after()}</div>
    <div class="chips scroll" role="radiogroup" aria-label="กระเป๋า">${choices.map(p => `<button class="chip ${p.id === q.potId ? 'on' : ''}" data-s="pot" data-id="${p.id}" role="radio" aria-checked="${p.id === q.potId}">${ic(p.icon)} ${esc(p.name)}</button>`).join('')}</div>
    <div class="subgrid" role="radiogroup" aria-label="รายการย่อย">${subs.map(s => `<button class="subopt ${q.subId === s.id ? 'on' : ''}" data-s="sub" data-id="${s.id}" role="radio" aria-checked="${q.subId === s.id}">${ic(s.icon)}<span>${esc(s.name)}</span></button>`).join('')}<button class="subopt ${!q.subId ? 'on' : ''}" data-s="sub" data-id="" role="radio" aria-checked="${!q.subId}">${ic('dots')}<span>อื่น ๆ</span></button><button class="subopt add" data-s="addsub">${ic('plus')}<span>เพิ่มรายการ</span></button></div>
    ${q.noteOpen ? `<input class="field" id="qa-note" placeholder="บันทึกช่วยจำ เช่น ข้าวมันไก่" value="${esc(q.note)}" maxlength="80">` : ''}
    <div class="pad">${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(k => `<button class="key" data-s="k" data-k="${k}">${k}</button>`).join('')}<button class="key fn ${q.note ? 'on' : ''}" data-s="note">${ic('note')} โน้ต</button><button class="key" data-s="k" data-k="0">0</button><button class="key fn" data-s="k" data-k="bs" aria-label="ลบตัวเลข">${ic('backspace')}</button></div>
    <div class="err" id="qa-err"></div>
    <button class="btn primary block save" data-s="save">${q.editId ? 'บันทึกการแก้ไข' : 'บันทึก'}</button>
    ${q.editId ? `<button class="btn ghost block" data-s="del" style="color:var(--wine-soft)">ลบรายการนี้</button>` : ''}`;
    const di = box.querySelector('#qa-date'); di.addEventListener('change', () => { if (di.value) { q.date = di.value > today() ? today() : di.value; draw(); } });
    const n = box.querySelector('#qa-note'); if (n) n.addEventListener('input', () => { q.note = n.value; });
  }
  function key(k) {
    if (k === 'bs') q.amount = q.amount.slice(0, -1);
    else if (q.amount.length < 9 && !(q.amount === '' && k === '0')) q.amount += k;
    box.querySelector('.qa-amt').textContent = '฿' + (q.amount ? fmt(+q.amount) : '0');
    box.querySelector('.qa-amt').classList.toggle('ph', !q.amount);
    box.querySelector('.qa-after').innerHTML = after();
    box.querySelector('#qa-err').textContent = '';
  }
  function saveQ() {
    const amt = +q.amount;
    if (!amt) { box.querySelector('#qa-err').textContent = 'ใส่จำนวนเงินก่อน'; return; }
    const data = { amount: amt, potId: q.potId, subId: q.subId || null, date: q.date, note: (q.note || '').trim() };
    if (orig) Object.assign(orig, data); else S.tx.push({ id: uid(), ts: Date.now(), type: 'expense', ...data });
    S.lastPot = q.potId; save(); closeSheet(); render();
    toast(orig ? 'แก้ไขแล้ว' : `บันทึก ${baht(amt)} แล้ว`);
  }
  function onS(a, d) {
    if (a === 'k') key(d.k);
    else if (a === 'pot') { q.potId = d.id; if (q.subId && (sub(q.subId) || {}).potId !== d.id) q.subId = null; draw(); }
    else if (a === 'sub') { q.subId = d.id || null; draw(); }
    else if (a === 'note') { q.noteOpen = !q.noteOpen || !!q.note; draw(); const n = box.querySelector('#qa-note'); n && n.focus(); }
    else if (a === 'addsub') openSubEdit(null, q.potId, sid => openQuickAdd({ ...q, subId: sid }));
    else if (a === 'save') saveQ();
    else if (a === 'del') openConfirm({ title: 'ลบรายการนี้', body: `ลบรายจ่าย ${baht(orig.amount)} ของวันที่ ${dayLabel(orig.date)}`, ok: 'ลบ', danger: true, onOk: () => { S.tx = S.tx.filter(t => t !== orig); save(); render(); toast('ลบแล้ว'); } });
  }
  QA_KEYS = e => {
    if (e.target.matches('input,textarea')) { if (e.key === 'Enter') { e.preventDefault(); saveQ(); } return; }
    if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('bs'); else if (e.key === 'Enter') saveQ(); else return;
    e.preventDefault();
  };
  draw();
}

/* ---------- sheets: pot detail, withdraw, pay ---------- */
function openPot(pid) {
  const p = pot(pid), ym = curYm(); if (!p) return;
  if (p.mode === 'debt') return openDebtPot();
  let h = `<div class="sheet-h"><span class="pot-ic lg" style="color:var(--pc-${p.color})">${ic(p.icon)}</span><div><h2>${esc(p.name)}</h2><small>${p.mode === 'acc' ? 'สะสมต่อเนื่อง' : 'รายเดือน · เงินเหลือย้ายเข้าเงินเก็บ'}${p.locked ? ' · ล็อกไว้' : ''}</small></div>${closeBtn}</div>`;
  const subs = subsOf(p.id);
  if (p.mode === 'acc') {
    const b = accBalance(p.id);
    h += `<div class="num big">${baht(b)}</div><div class="muted sm">เดือนนี้เข้า ${fmt(potAlloc(p.id, ym))}</div>`;
    if (subs.length) {
      const sb = subs.map(s => ({ s, b: subBalance(s.id) })), un = b - sum(sb.map(x => x.b));
      h += `<div class="sec"><span>รายการย่อย</span></div><div class="list">${sb.map(({ s, b }) => `<button class="tx" data-s="subEdit" data-id="${s.id}"><span class="tx-ic">${ic(s.icon)}</span><span class="tx-main"><span>${esc(s.name)}</span><small>${s.target ? `เป้า ${fmt(s.target)} · ${Math.round(b / s.target * 100)}%` : s.monthly ? `เดือนละ ${fmt(s.monthly)}` : 'ไม่มีเป้า'}</small>${s.target ? `<span style="display:block;margin-top:5px">${bar(b / s.target * 100, 'var(--accent)')}</span>` : ''}</span><span class="num">${fmt(b)}</span></button>`).join('')}${un ? `<div class="tx"><span class="tx-ic">${ic('dots')}</span><span class="tx-main"><span>ยังไม่ระบุรายการย่อย</span></span><span class="num">${fmt(un)}</span></div>` : ''}</div>`;
    }
  } else {
    const a = potAlloc(p.id, ym), s = potSpent(p.id, ym);
    h += `<div class="num big">${baht(a - s)}</div><div class="muted sm">เหลือจาก ${fmt(a)} · ใช้ไป ${fmt(s)}</div>`;
    if (subs.length) {
      const oth = sum(S.tx.filter(t => t.type === 'expense' && t.potId === p.id && !sub(t.subId) && inYm(t, ym)).map(t => t.amount));
      h += `<div class="sec"><span>เดือนนี้แยกตามรายการ</span></div><div class="list">${subs.map(x => { const sa = subAllocOf(x.id, ym), ss = subSpent(x.id, ym); return `<button class="tx" data-s="subEdit" data-id="${x.id}"><span class="tx-ic">${ic(x.icon)}</span><span class="tx-main"><span>${esc(x.name)}</span>${sa ? `<small>งบ ${fmt(sa)} · เหลือ ${fmt(sa - ss)}</small><span style="display:block;margin-top:5px">${bar(ss / sa * 100, ss > sa ? 'var(--wine-soft)' : 'var(--accent)')}</span>` : '<small>ไม่ได้ตั้งงบ</small>'}</span><span class="num">${fmt(ss)}</span></button>`; }).join('')}${oth ? `<div class="tx"><span class="tx-ic">${ic('dots')}</span><span class="tx-main"><span>อื่น ๆ</span></span><span class="num">${fmt(oth)}</span></div>` : ''}</div>`;
    }
  }
  h += `<div class="row-actions"><button class="btn" data-s="edit">${ic('pencil')} แก้ไขกระเป๋า</button>${p.locked ? `<button class="btn primary" data-s="withdraw">${ic('lock-open')} ดึงเงินออก</button>` : `<button class="btn primary" data-s="add">${ic('plus')} จดรายจ่าย</button>`}</div>`;
  const txs = S.tx.filter(t => (p.mode === 'month' ? (OUT.has(t.type) && t.potId === p.id && inYm(t, ym)) : ((OUT.has(t.type) && t.potId === p.id) || t.toPotId === p.id || t.selfPot === p.id))).sort(sortTx).slice(0, 15);
  if (txs.length) h += `<div class="sec"><span>${p.mode === 'month' ? 'รายการเดือนนี้' : 'ความเคลื่อนไหวล่าสุด'}</span></div><div class="list">${txs.map(txRow).join('')}</div>`;

  ${fNum('d-bal', isNew ? 'ยอดหนี้คงเหลือตอนนี้' : 'ยอดหนี้ตอนเริ่มบันทึก', d.balance0, '21600', pays ? `จ่ายผ่านแอปไปแล้ว ${pays} งวด ยอดคงเหลือคำนวณจากยอดนี้` : '')}
  ${fNum('d-inst', 'ค่างวดต่อเดือน', d.installment, '2700')}
  ${d.selfPot ? '' : fNum('d-paid', 'จ่ายไปแล้วกี่งวด (ก่อนเริ่มใช้แอป)', d.paid0, '0')}
  ${fNum('d-day', 'จ่ายทุกวันที่', d.day, '1', 'ถึงวันนี้ของเดือน จะขึ้นที่หน้าแรกให้กดยืนยัน')}
  <div class="card" style="margin-top:12px" id="d-prev"></div>
  <button type="button" class="toggle-row" data-s="goal"><span>นับเป็นเป้าปลดหนี้ปีนี้<small>แสดงในหน้าเป้าหมายว่าจะปิดทันไหม</small></span><span class="toggle ${inGoal ? 'on' : ''}"></span></button>
  <div class="err"></div>
  <div class="stack"><button class="btn primary block" data-s="save">${isNew ? 'เพิ่มหนี้' : 'บันทึก'}</button>${isNew ? '' : `<button class="btn ghost block" data-s="del" style="color:var(--wine-soft)">ลบหนี้นี้</button>`}</div>`;
  const read = () => ({ bal: parseNum(val(sh, 'd-bal')), inst: parseNum(val(sh, 'd-inst')), paid: d.selfPot ? 0 : parseNum(val(sh, 'd-paid')), day: parseNum(val(sh, 'd-day')) });
  const sh = sheet(h, (a, x, el) => {
    if (a === 'icon') { d.icon = x.icon; pick(sh, '.icopt', el); }
    else if (a === 'goal') { inGoal = !inGoal; el.querySelector('.toggle').classList.toggle('on', inGoal); }
    else if (a === 'save') {
      const r = read(); d.name = val(sh, 'd-name').trim();
      if (!d.name) return setErr(sh, 'ตั้งชื่อหนี้ก่อน');
      if (!r.bal) return setErr(sh, 'ใส่ยอดหนี้คงเหลือ');
      if (!r.inst) return setErr(sh, 'ใส่ค่างวดต่อเดือน');
      if (r.day < 1 || r.day > 31) return setErr(sh, 'วันที่ต้องอยู่ระหว่าง 1 ถึง 31');
      Object.assign(d, { balance0: r.bal, installment: r.inst, paid0: r.paid, day: r.day });
      if (isNew) S.debts.push(d); else Object.assign(debt(id), d);
      g.debts = g.debts.filter(x => x !== d.id); if (inGoal) g.debts.push(d.id);
      save(); closeSheet(); render();
      toast(isNew && allocated(curYm()) ? 'เพิ่มหนี้แล้ว ยอดกระเป๋าหนี้สินเดือนนี้ปรับได้ที่หน้าแบ่งเงิน' : (isNew ? 'เพิ่มหนี้แล้ว' : 'บันทึกแล้ว'));
      after && after();
    } else if (a === 'del') openConfirm({ title: `ลบ${d.name}`, body: 'ประวัติการชำระที่บันทึกไว้ยังอยู่ในรายการเดือนเดิม', ok: 'ลบ', danger: true, onOk: () => { S.debts = S.debts.filter(x => x.id !== id); for (const k in S.goals) S.goals[k].debts = S.goals[k].debts.filter(x => x !== id); save(); render(); toast('ลบแล้ว'); } });
  }, { label: 'หนี้' });
  const prev = () => {
    const r = read(), box = sh.querySelector('#d-prev');
    if (!r.bal || !r.inst) { box.innerHTML = '<small class="muted">ใส่ยอดคงเหลือและค่างวด แอปจะนับงวดให้</small>'; return; }
    const paidApp = isNew ? 0 : sum(S.tx.filter(t => t.type === 'debtpay' && t.debtId === d.id).map(t => t.amount));
    const bal = Math.max(0, r.bal - paidApp), left = Math.ceil(bal / r.inst), done = r.paid + pays;
    box.innerHTML = `<div class="kv"><span>ทั้งหมด</span><b class="num">${done + left} งวด</b></div><div class="kv"><span>เหลืออีก</span><b class="num acc">${left} งวด</b></div>${left ? `<small class="muted">ถ้าจ่ายครบทุกเดือน จะปิดได้ ${monthLabel(ymAdd(d.startYm > curYm() ? d.startYm : curYm(), left - 1))}</small>` : ''}`;
  };
  ['d-bal', 'd-inst', 'd-paid'].forEach(k => { const e = sh.querySelector('#' + k); e && e.addEventListener('input', prev); });
  prev();
}
function openRecEdit(id) {
  const isNew = !id, sp = spendPots();
  if (!sp.length) { toast('ต้องมีกระเป๋าที่จดรายจ่ายได้ก่อน'); return; }
  const r = isNew ? { id: uid(), name: '', amount: 0, potId: (dailyPot() || sp[0]).id, subId: null, day: 1 } : { ...S.recurring.find(x => x.id === id) };
  const h = `<div class="sheet-h"><div><h2>${isNew ? 'รายการประจำใหม่' : 'แก้ไขรายการประจำ'}</h2></div>${closeBtn}</div>
  ${fText('r-name', 'ชื่อ', r.name, 'เช่น ค่าเน็ต, ค่าไฟ')}
  ${fNum('r-amt', 'ยอดโดยประมาณ', r.amount, '599', 'ตอนยืนยันแก้ยอดจริงได้')}
  <label class="fl">จ่ายจากกระเป๋า</label><div class="chips" id="r-pots">${sp.map(p => `<button class="chip ${p.id === r.potId ? 'on' : ''}" data-s="pot" data-id="${p.id}">${ic(p.icon)} ${esc(p.name)}</button>`).join('')}</div>
  <label class="fl">รายการย่อย</label><div class="chips" id="r-subs"></div>
  ${fNum('r-day', 'ทุกวันที่', r.day, '1')}
  <div class="err"></div>
  <div class="stack"><button class="btn primary block" data-s="save">${isNew ? 'เพิ่มรายการ' : 'บันทึก'}</button>${isNew ? '' : `<button class="btn ghost block" data-s="del" style="color:var(--wine-soft)">ลบรายการประจำ</button>`}</div>`;
  const sh = sheet(h, (a, d, el) => {
    if (a === 'pot') { r.potId = d.id; r.subId = null; pick(sh, '#r-pots .chip', el); subs(); }
    else if (a === 'sub') { r.subId = d.id || null; pick(sh, '#r-subs .chip', el); }
    else if (a === 'save') {
      r.name = val(sh, 'r-name').trim(); r.amount = parseNum(val(sh, 'r-amt')); r.day = parseNum(val(sh, 'r-day'));
      if (!r.name) return setErr(sh, 'ตั้งชื่อรายการก่อน');
      if (r.day < 1 || r.day > 31) return setErr(sh, 'วันที่ต้องอยู่ระหว่าง 1 ถึง 31');
      if (isNew) S.recurring.push(r); else Object.assign(S.recurring.find(x => x.id === id), r);
      save(); closeSheet(); render(); toast('บันทึกแล้ว');
    } else if (a === 'del') openConfirm({ title: 'ลบรายการประจำ', body: 'รายจ่ายที่ยืนยันไปแล้วยังอยู่ครบ', ok: 'ลบ', danger: true, onOk: () => { S.recurring = S.recurring.filter(x => x.id !== id); save(); render(); } });
  }, { label: 'รายการประจำ' });
  function subs() { sh.querySelector('#r-subs').innerHTML = [['', 'ไม่ระบุ'], ...subsOf(r.potId).map(s => [s.id, s.name])].map(([sid, n]) => `<button class="chip ${(r.subId || '') === sid ? 'on' : ''}" data-s="sub" data-id="${sid}">${esc(n)}</button>`).join(''); }
  subs();
}
function openGoalEdit() {
  const yi = yearInfo(), g = goalsFor(yi.idx), sel = new Set(g.debts);
  const act = S.debts.filter(d => dstate(d).bal > 0);
  const h = `<div class="sheet-h"><div><h2>เป้าหมายปีที่ ${yi.idx + 1}</h2><small>${monthLabel(yi.start, 'shortY')} – ${monthLabel(yi.end, 'shortY')}</small></div>${closeBtn}</div>
  ${fNum('g-save', 'เก็บเงินให้ได้ทั้งปี', g.save, '100000', 'นับจากกระเป๋าที่ตั้งว่า "นับเข้าเป้าเก็บเงิน" รวมเงินเหลือสิ้นเดือน')}
  ${fNum('g-inv', 'ลงทุนให้ได้ทั้งปี', g.invest, '60000')}
  <label class="fl">ปลดหนี้ให้ได้ภายในปีนี้</label>${act.length ? act.map(d => `<button type="button" class="toggle-row" data-s="dt" data-id="${d.id}"><span>${ic(d.icon)} ${esc(d.name)}<small>เหลือ ${fmt(dstate(d).bal)}</small></span><span class="toggle ${sel.has(d.id) ? 'on' : ''}"></span></button>`).join('') : '<p class="note">ยังไม่มีหนี้ เพิ่มได้ที่ เมนู › หนี้สิน</p>'}
  <div class="stack"><button class="btn primary block" data-s="save">บันทึกเป้าหมาย</button></div>`;
  const sh = sheet(h, (a, d, el) => {
    if (a === 'dt') { sel.has(d.id) ? sel.delete(d.id) : sel.add(d.id); el.querySelector('.toggle').classList.toggle('on', sel.has(d.id)); }
    else if (a === 'save') { S.goals[yi.idx] = { save: parseNum(val(sh, 'g-save')), invest: parseNum(val(sh, 'g-inv')), debts: [...sel] }; save(); closeSheet(); render(); toast('บันทึกเป้าหมายแล้ว'); }
  }, { label: 'เป้าหมาย' });
}

/* ---------- background image, backup ---------- */
async function loadBg(file) {
  try {
    const url = URL.createObjectURL(file), img = new Image(); img.src = url; await img.decode();
    const r = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    let q = .82, data = c.toDataURL('image/jpeg', q);
    while (data.length > 1500000 && q > .4) { q -= .1; data = c.toDataURL('image/jpeg', q); }
    localStorage.setItem(BGKEY, data); BGIMG = data; S.settings.bg = 'custom'; save(); render(); toast('เปลี่ยนพื้นหลังแล้ว');
  } catch (e) { toast('ใช้รูปนี้ไม่ได้ ลองรูปอื่นหรือรูปที่เล็กกว่านี้'); }
}
async function doBackup() {
  const name = `kumngoen-backup-${today()}.json`;
  S.lastBackup = Date.now();
  const file = new File([JSON.stringify({ app: 'kumngoen', v: 1, exportedAt: new Date().toISOString(), data: S })], name, { type: 'application/json' });
  try {
    if (MOBILE && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'สำรองข้อมูลคุมเงิน' }); save(); render(); toast('สำรองข้อมูลแล้ว'); return; }
  } catch (e) { if (e && e.name === 'AbortError') { S.lastBackup = null; return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  save(); render(); toast('ดาวน์โหลดไฟล์สำรองแล้ว');
}
async function doRestore(file) {
  try {
    const j = JSON.parse(await file.text()), d = j && j.data ? j.data : j;
    if (!d || !Array.isArray(d.pots) || !Array.isArray(d.tx) || typeof d.months !== 'object') throw new Error('bad');
    const when = j.exportedAt ? DTF.full.format(new Date(j.exportedAt)) : 'ไม่ทราบวันที่';
    openConfirm({ title: 'นำข้อมูลกลับ', body: `ไฟล์นี้สำรองเมื่อ ${esc(when)} มี ${d.tx.length} รายการ ข้อมูลในเครื่องนี้จะถูกแทนที่ทั้งหมด`, ok: 'แทนที่ข้อมูล', danger: true, onOk: () => { S = migrate(d); save(); go('home'); toast('นำข้อมูลกลับแล้ว'); } });
  } catch (e) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของคุมเงิน'); }
}

/* ---------- global actions ---------- */
const A = {
  go: d => go(d.v),
  add: () => openQuickAdd(),
  alloc: d => startAlloc(d.ym || curYm()),
  allocSave: () => saveAlloc(),
  debtNew: () => openDebtEdit(null, () => { if (view === 'alloc') { render(); } }),
  debtEdit: d => openDebtEdit(d.id),
  review: d => { UI.reviewYm = d.ym; go('review'); },
  closeMonth: d => { closeMonth(d.ym); toast('ปิดเดือนแล้ว'); if (!allocated(curYm())) startAlloc(curYm()); else go('home'); },
  pot: d => openPot(d.id),
  pend: d => d.k === 'rec' ? openRecConfirm(d.id) : openDebtPay(d.id, true),
  tx: d => openTx(d.id),
  sumMove: d => { UI.sumYm = ymAdd(UI.sumYm || curYm(), +d.d); render(); },
  sumYm: d => { UI.sumYm = d.ym; render(); },
  sumPot: d => { UI.sumPot = d.id; render(); },
  goalEdit: () => openGoalEdit(),
  potMove: d => { const i = S.pots.findIndex(p => p.id === d.id), j = i + +d.d; if (j < 0 || j >= S.pots.length) return; [S.pots[i], S.pots[j]] = [S.pots[j], S.pots[i]]; save(); render(); },
  potEdit: d => openPotEdit(d.id),
  potNew: () => openPotEdit(null),
  potShow: d => { pot(d.id).hidden = false; save(); render(); },
  subNew: d => openSubEdit(null, d.pot),
  subEdit: d => openSubEdit(d.id),
  recNew: () => openRecEdit(null),
  recEdit: d => openRecEdit(d.id),
  bg: d => { S.settings.bg = d.v; save(); render(); },
  bgUpload: () => $('#bgfile').click(),
  bgRemove: () => { try { localStorage.removeItem(BGKEY); } catch (e) {} BGIMG = null; if (S.settings.bg === 'custom') S.settings.bg = 'navy'; save(); render(); },
  accent: d => { S.settings.accent = d.v; save(); render(); },
  numf: d => { S.settings.numFont = d.v; save(); render(); },
  backup: () => doBackup(),
  restore: () => $('#restorefile').click(),
  reset: () => openConfirm({ title: 'ล้างข้อมูลทั้งหมด', body: 'รายการ หนี้ เป้าหมาย และการตั้งค่าทั้งหมดในเครื่องนี้จะหายไป และกู้คืนไม่ได้ถ้าไม่มีไฟล์สำรอง', ok: 'ล้างข้อมูล', danger: true, onOk: () => { try { localStorage.removeItem(KEY); localStorage.removeItem(BGKEY); } catch (e) {} BGIMG = null; S = defaults(); save(); go('home'); toast('ล้างข้อมูลแล้ว'); } }),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('input', e => {
  const t = e.target; if (view !== 'alloc' || !UI.draft) return;
  if (t.id === 'a-inc') UI.draft.income = parseNum(t.value);
  else if (t.dataset.f === 'pot') UI.draft.alloc[t.dataset.id] = parseNum(t.value);
  else if (t.dataset.f === 'sub') UI.draft.subAlloc[t.dataset.id] = parseNum(t.value);
  else return;
  const err = $('#a-err'); if (err) err.textContent = '';
  updateAllocFooter();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && CUR) { closeSheet(); return; }
  if (QA_KEYS && CUR) QA_KEYS(e);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !CUR) render(); });

/* ---------- start ---------- */
load(); render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

</script>
